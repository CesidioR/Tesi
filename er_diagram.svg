<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="850" height="520" fill="#ffffff"/>

  <!-- Titolo -->
  <text x="425" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Schema del database locale (SQLite)</text>

  <!-- =================== PRICES =================== -->
  <rect x="40" y="50" width="230" height="150" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="40" y="50" width="230" height="30" fill="#33373d"/>
  <text x="155" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">prices</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1a1a1a">
    <text x="52" y="96" text-decoration="underline" font-weight="bold">ticker</text>
    <text x="260" y="96" text-anchor="end" font-size="9.5" fill="#777777">TEXT &#183; PK</text>
    <line x1="40" y1="104" x2="270" y2="104" stroke="#dddddd"/>
    <text x="52" y="120" text-decoration="underline" font-weight="bold">date</text>
    <text x="260" y="120" text-anchor="end" font-size="9.5" fill="#777777">TEXT &#183; PK</text>
    <line x1="40" y1="128" x2="270" y2="128" stroke="#dddddd"/>
    <text x="52" y="144">high</text>
    <text x="260" y="144" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="40" y1="152" x2="270" y2="152" stroke="#dddddd"/>
    <text x="52" y="168">low</text>
    <text x="260" y="168" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="40" y1="176" x2="270" y2="176" stroke="#dddddd"/>
    <text x="52" y="192">close</text>
    <text x="260" y="192" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
  </g>

  <!-- =================== MARKET =================== -->
  <rect x="40" y="250" width="230" height="78" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="40" y="250" width="230" height="30" fill="#33373d"/>
  <text x="155" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">market</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1a1a1a">
    <text x="52" y="296" text-decoration="underline" font-weight="bold">date</text>
    <text x="260" y="296" text-anchor="end" font-size="9.5" fill="#777777">TEXT &#183; PK</text>
    <line x1="40" y1="304" x2="270" y2="304" stroke="#dddddd"/>
    <text x="52" y="320">vix</text>
    <text x="260" y="320" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
  </g>

  <!-- =================== PORTFOLIOS =================== -->
  <rect x="560" y="50" width="250" height="246" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="560" y="50" width="250" height="30" fill="#33373d"/>
  <text x="685" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">portfolios</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1a1a1a">
    <text x="572" y="96" text-decoration="underline" font-weight="bold">id</text>
    <text x="800" y="96" text-anchor="end" font-size="9.5" fill="#777777">INTEGER &#183; PK</text>
    <line x1="560" y1="104" x2="810" y2="104" stroke="#dddddd"/>
    <text x="572" y="120">name</text>
    <text x="800" y="120" text-anchor="end" font-size="9.5" fill="#777777">TEXT</text>
    <line x1="560" y1="128" x2="810" y2="128" stroke="#dddddd"/>
    <text x="572" y="144">commission_bps</text>
    <text x="800" y="144" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="560" y1="152" x2="810" y2="152" stroke="#dddddd"/>
    <text x="572" y="168">base_fees</text>
    <text x="800" y="168" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="560" y1="176" x2="810" y2="176" stroke="#dddddd"/>
    <text x="572" y="192">cash</text>
    <text x="800" y="192" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="560" y1="200" x2="810" y2="200" stroke="#dddddd"/>
    <text x="572" y="216">fees_paid</text>
    <text x="800" y="216" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="560" y1="224" x2="810" y2="224" stroke="#dddddd"/>
    <text x="572" y="240">base_value</text>
    <text x="800" y="240" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="560" y1="248" x2="810" y2="248" stroke="#dddddd"/>
    <text x="572" y="264">target_model</text>
    <text x="800" y="264" text-anchor="end" font-size="9.5" fill="#777777">INTEGER</text>
    <line x1="560" y1="272" x2="810" y2="272" stroke="#dddddd"/>
    <text x="572" y="288">target_method</text>
    <text x="800" y="288" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
  </g>

  <!-- =================== HOLDINGS =================== -->
  <rect x="560" y="330" width="250" height="126" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="560" y="330" width="250" height="30" fill="#33373d"/>
  <text x="685" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">holdings</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1a1a1a">
    <text x="572" y="376" text-decoration="underline" font-weight="bold">portfolio_id</text>
    <text x="800" y="376" text-anchor="end" font-size="9.5" fill="#777777">INTEGER &#183; PK &#183; FK</text>
    <line x1="560" y1="384" x2="810" y2="384" stroke="#dddddd"/>
    <text x="572" y="400" text-decoration="underline" font-weight="bold">ticker</text>
    <text x="800" y="400" text-anchor="end" font-size="9.5" fill="#777777">TEXT &#183; PK</text>
    <line x1="560" y1="408" x2="810" y2="408" stroke="#dddddd"/>
    <text x="572" y="424">weight</text>
    <text x="800" y="424" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
    <line x1="560" y1="432" x2="810" y2="432" stroke="#dddddd"/>
    <text x="572" y="448">entry_price</text>
    <text x="800" y="448" text-anchor="end" font-size="9.5" fill="#777777">REAL</text>
  </g>

  <!-- =================== RELAZIONE FK: portfolios (1) -> holdings (N) =================== -->
  <line x1="679" y1="306" x2="691" y2="306" stroke="#222222" stroke-width="1.5"/>
  <text x="696" y="310" font-size="11" fill="#333333">1</text>
  <line x1="685" y1="296" x2="685" y2="318" stroke="#222222" stroke-width="1.5"/>
  <line x1="685" y1="318" x2="672" y2="330" stroke="#222222" stroke-width="1.5"/>
  <line x1="685" y1="318" x2="685" y2="330" stroke="#222222" stroke-width="1.5"/>
  <line x1="685" y1="318" x2="698" y2="330" stroke="#222222" stroke-width="1.5"/>
  <text x="703" y="326" font-size="11" fill="#333333">N</text>

  <!-- =================== JOIN LOGICI (dashed) =================== -->
  <!-- prices.date  <->  market.date -->
  <path d="M40,116 H24 V292 H40" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="8" y="196" width="30" height="16" fill="#ffffff"/>
  <text x="23" y="208" text-anchor="middle" font-size="10" fill="#777777" transform="rotate(-90 23 204)">date</text>

  <!-- prices.ticker  <->  holdings.ticker -->
  <line x1="270" y1="92" x2="560" y2="396" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="391" y="237" width="48" height="16" fill="#ffffff"/>
  <text x="415" y="249" text-anchor="middle" font-size="10" fill="#777777">ticker</text>

  <!-- =================== LEGENDA =================== -->
  <line x1="44" y1="492" x2="78" y2="492" stroke="#222222" stroke-width="1.8"/>
  <text x="86" y="496" font-size="11" fill="#333333">chiave esterna (vincolo FK)</text>
  <line x1="330" y1="492" x2="364" y2="492" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="372" y="496" font-size="11" fill="#333333">join logico (nessun vincolo FK)</text>
</svg>
